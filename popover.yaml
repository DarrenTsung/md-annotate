          - emphasis [ref=e57]: smaller
          - text: "than the raw bytes — while pzc keeps the whole buffer and holds every value, duplicates included. The trade points the other way from latency: roughly parity to ~1.8x eager on most real files, and much worse only on a pathological all-duplicate file (though tiny in absolute terms). (An earlier 2x regression from holding blobs twice — once in the buffer, once in the decoded blob map — was fixed by compacting node buffers after decode, which is why many blob-heavy files now sit at ~parity.)"
